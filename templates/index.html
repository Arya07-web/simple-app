<!DOCTYPE html>
<html>
<head>
    <title>Student Portal</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #0077cc;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: auto;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 5px gray;
        }

        h2 {
            color: #0077cc;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Student Portal Dashboard</h1>
    </div>

    <div class="container">

        {% for student in students %}
        <div class="card">
            <h2>{{ student.name }}</h2>
            <p><b>Course:</b> {{ student.course }}</p>
            <p><b>Marks:</b> {{ student.marks }}</p>
        </div>
        {% endfor %}

    </div>

</body>
</html>
